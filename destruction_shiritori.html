<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>デストラクションしりとり</title><style>
*{box-sizing:border-box}body{margin:0;background:#101619;color:#edf4f2;font:15px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px 12px 120px}h1{font-size:24px;margin:8px 0}small{color:#a8b9b5}header{margin-bottom:16px}.stats{display:flex;gap:8px;margin:16px 0}.stats div{flex:1;background:#202c30;border-radius:10px;padding:12px;text-align:center}.stats b{display:block;font-size:25px}section{background:#1b2428;border:1px solid #344348;border-radius:12px;padding:12px;margin:10px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:6px}button,input{font:inherit;border-radius:8px;border:1px solid #526361;padding:10px;color:inherit;background:#263438}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}.tile{background:#194437;color:#c3f5db;min-height:48px;font-size:13px;border-color:#326552}.dead{background:#49272d;color:#eaa2a2;text-decoration:line-through;border-color:#78434a}.pending{background:#66531e;color:#fff0a8;border-color:#e6bc53}.group{width:100%;margin-top:8px;font-size:13px}.ready{color:#ffda76}.dock{position:fixed;bottom:0;left:0;right:0;background:#182226;border-top:1px solid #526361;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:2}.dockinner{max-width:826px;margin:auto}.controls{display:flex;gap:6px}.controls input{flex:1;min-width:0;background:#101619}.primary{background:#a9ebca;color:#123326;font-weight:bold}.tag{display:inline-block;background:#49272d;color:#ffc0c0;border-radius:5px;padding:4px 7px;margin:3px;font-size:12px}.entry{border-top:1px solid #344348;padding:10px 0;overflow-wrap:anywhere}.entry b{font-size:17px}.tools{display:flex;gap:8px;flex-wrap:wrap}#status{font-size:12px;color:#ffda76;min-height:18px;margin-bottom:5px}h2{font-size:19px}details{margin:12px 0;color:#b9cbc5}button:focus-visible,input:focus-visible{outline:2px solid #ffe08a}</style><main><header><small>DESTRUCTION SHIRITORI / VER. 1.0</small><h1>デストラクションしりとり</h1><small>通話・対面プレイ用 / 手動判定</small></header><div class="stats" id="stats"></div><details><summary>操作方法・ルール</summary><p>単語を入力し、破壊するジャンルを選択（黄色）。必要なら大カテゴリ全破壊を選択し、確定すると赤色になりログに記録されます。連鎖破壊は手動です。判定・勝敗は参加者で協議してください。</p><p>同じ単語は禁止。「ん」で終了。長音は直前の音、濁点・半濁点は同一扱い、小文字は大文字扱い。開始の「しりとり」は記録不要。</p></details><div id="board"></div><section><div class="head"><h2>しりとりログ</h2><button id="copy">ログをコピー</button></div><div id="log"></div></section><div class="tools"><button id="undo">↶ 一手戻す</button><button id="reset">ゲームリセット</button></div><p><small id="save">端末内に自動保存（通信・端末間同期なし）</small></p></main><div class="dock"><div class="dockinner"><div id="status" aria-live="polite"></div><div class="controls"><input id="word" placeholder="使用した単語" autocomplete="off"><button id="clear">選択解除</button><button class="primary" id="commit">確定</button></div></div></div><script>
const groups=[['動物',3,['哺乳類','鳥類','爬虫類','両生類','虫','魚類','海の生き物']],['植物',3,['野菜','果物','花','木','穀物','菌＆その他']],['飲食物',2,['料理','菓子','飲料','酒類','調味料']],['乗り物',2,['自動車','鉄道','船舶','航空機','その他の乗り物']],['生活用品',3,['家具','家電','道具','文房具','時計','照明']],['身につける',2,['衣類','履物','装飾品＆化粧品','かばん類']],['娯楽',3,['漫画・アニメ','文学作品','映画・演劇','音楽・楽器','玩具・ゲーム','スポーツ','ギャンブル']],['自然・物質',3,['天体・宇宙','気象・自然現象','金属','その他の素材','エネルギー','色']],['人類',3,['人名','職業','身体部位','病気・症状','排泄物','感情','生死','人間関係']],['社会',3,['国','その他の地名','軍事・兵器','金銭・貴重品','建築物','組織・団体','法律・制度','行事・風習']],['知識・概念',2,['情報＆文字','学問＆思想＆宗教','神話＆伝承','芸術＆表現','時間＆数字＆単位']]];
const $=id=>document.getElementById(id),key='destruction-shiritori-v1';let history=[],selected=new Set(),whole=new Set();try{const h=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(h))history=h}catch(e){}const ids=g=>groups[g][2].map((_,i)=>g+':'+i);const dead=()=>new Set(history.flatMap(h=>h.destroyed));const total=groups.reduce((n,g)=>n+g[2].length,0);function save(){try{localStorage.setItem(key,JSON.stringify(history))}catch(e){$('save').textContent='自動保存できません。この画面を閉じると記録が失われる可能性があります。'}}function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}function render(){const d=dead();$('stats').replaceChildren();for(const [label,n] of [['生存',total-d.size],['破壊済み',d.size],['手数',history.length]]){const x=el('div',label);x.append(el('b',n));$('stats').append(x)}$('board').replaceChildren();groups.forEach(([name,limit,labels],g)=>{const all=ids(g),count=all.filter(x=>d.has(x)).length,planned=all.filter(x=>selected.has(x)).length,full=count===all.length;const s=el('section'),head=el('div',undefined,'head');head.append(el('strong',name+(g===7?'（暫定）':'')),el('span',full?'全滅':`${count}${planned?' + '+planned:''} / ${limit} で全破壊`,count+planned>=limit?'ready':''));s.append(head);const grid=el('div',undefined,'tiles');labels.forEach((label,i)=>{const id=all[i],b=el('button',label,'tile '+(d.has(id)?'dead':selected.has(id)||whole.has(g)?'pending':''));b.disabled=d.has(id);b.setAttribute('aria-pressed',String(selected.has(id)||whole.has(g)));b.onclick=()=>{if(whole.has(g))whole.delete(g);if(selected.has(id))selected.delete(id);else selected.add(id);render()};grid.append(b)});s.append(grid);const b=el('button',whole.has(g)?'全破壊の選択を解除':full?'全破壊済み':count+planned>=limit?'連鎖破壊を選択':'大カテゴリ直接破壊を選択','group '+(whole.has(g)?'pending':''));b.disabled=full;b.onclick=()=>{whole.has(g)?whole.delete(g):whole.add(g);render()};s.append(b);$('board').append(s)});$('log').replaceChildren();if(!history.length)$('log').append(el('small','まだ記録はありません'));history.forEach((h,i)=>{const e=el('div',undefined,'entry');e.append(el('small',String(i+1).padStart(2,'0')+'　'),el('b',h.word));const tags=el('div');for(const t of h.tags)tags.append(el('span',t,'tag'));if(!h.tags.length)tags.append(el('small','破壊なし'));e.append(tags);$('log').append(e)});$('undo').disabled=!history.length;const pending=new Set([...selected,...[...whole].flatMap(ids)].filter(x=>!d.has(x)));$('status').textContent=`破壊予定 ${pending.size} ジャンル${whole.size?' / 全破壊 '+whole.size+'カテゴリ':''}`;}
$('commit').onclick=()=>{const word=$('word').value.trim();if(!word){$('word').focus();return}const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));if(history.some(h=>norm(h.word)===norm(word))&&!confirm('同じ単語が記録されています。協議のうえ確定しますか？'))return;const d=dead(),destroyed=new Set([...selected].filter(x=>!d.has(x))),tags=[...destroyed].map(x=>{const [g,i]=x.split(':').map(Number);return groups[g][2][i]});for(const g of whole){const all=ids(g),chain=all.filter(x=>d.has(x)||selected.has(x)).length>=groups[g][1];tags.push((chain?'連鎖破壊：':'直接破壊：')+groups[g][0]+' 全滅');all.filter(x=>!d.has(x)).forEach(x=>destroyed.add(x))}history.push({word,tags,destroyed:[...destroyed]});selected.clear();whole.clear();$('word').value='';save();render()};$('clear').onclick=()=>{selected.clear();whole.clear();render()};$('undo').onclick=()=>{if(history.length&&confirm('直前の一手を取り消しますか？')){history.pop();selected.clear();whole.clear();save();render()}};$('reset').onclick=()=>{if(confirm('すべての盤面とログを初期化しますか？')){history=[];selected.clear();whole.clear();$('word').value='';save();render()}};$('copy').onclick=async()=>{const t=history.map((h,i)=>`${i+1}. ${h.word} ${h.tags.map(t=>'('+t+')').join('')}`).join('\n');try{await navigator.clipboard.writeText(t);alert('ログをコピーしました')}catch(e){const a=el('textarea');a.value=t;document.body.append(a);a.select();try{if(!document.execCommand('copy'))throw Error();alert('ログをコピーしました')}catch(e){prompt('ログを手動でコピーしてください',t)}a.remove()}};render();</script></html>
