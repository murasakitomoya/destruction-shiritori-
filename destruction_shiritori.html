<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="./ds-favicon-v112.ico" sizes="any"><link rel="manifest" href="./manifest.webmanifest?v=112"><link rel="apple-touch-icon" href="./ds-icon-192-v112.png"><meta name="theme-color" content="#101619"><title>デストラクションしりとり</title><style>
*{box-sizing:border-box}body{margin:0;background:#101619;color:#edf4f2;font:15px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px 12px 120px}h1{font-size:24px;margin:8px 0}small{color:#a8b9b5}header{margin-bottom:16px}.stats{display:flex;gap:8px;margin:16px 0}.stats div{flex:1;background:#202c30;border-radius:10px;padding:12px;text-align:center}.stats b{display:block;font-size:25px}section{background:#1b2428;border:1px solid #344348;border-radius:12px;padding:12px;margin:10px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:6px}button,input{font:inherit;border-radius:8px;border:1px solid #526361;padding:10px;color:inherit;background:#263438}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}.tile{background:#194437;color:#c3f5db;min-height:48px;font-size:13px;border-color:#326552}.dead{background:#49272d;color:#eaa2a2;text-decoration:line-through;border-color:#78434a}.pending{background:#66531e;color:#fff0a8;border-color:#e6bc53}.group{width:100%;margin-top:8px;font-size:13px}.ready{color:#ffda76}.dock{position:fixed;bottom:0;left:0;right:0;background:#182226;border-top:1px solid #526361;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:2}.dockinner{max-width:826px;margin:auto}.controls{display:flex;gap:6px}.controls input{flex:1;min-width:0;background:#101619}.primary{background:#a9ebca;color:#123326;font-weight:bold}.tag{display:inline-block;background:#49272d;color:#ffc0c0;border-radius:5px;padding:4px 7px;margin:3px;font-size:12px}.entry{border-top:1px solid #344348;padding:10px 0;overflow-wrap:anywhere}.entry b{font-size:17px}.tools{display:flex;gap:8px;flex-wrap:wrap}#status{font-size:12px;color:#ffda76;min-height:18px;margin-bottom:5px}h2{font-size:19px}details{margin:12px 0;color:#b9cbc5}button:focus-visible,input:focus-visible{outline:2px solid #ffe08a}
select,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:8px}body{background:var(--bg);color:var(--fg)}section,.stats div,.dock,button,input{background:var(--panel);border-color:var(--edge)}.controls input{background:var(--bg)}small,details{color:var(--fg);opacity:.85}.tile{background:var(--alive);color:var(--fg);border-color:var(--edge)}.dead,.tag{background:var(--dead);color:var(--fg)}.pending{background:var(--pending);color:var(--fg)}.ready,#status{color:var(--fg)}.primary{background:var(--fg);color:var(--bg)}.editrow{display:flex;gap:6px;margin:6px 0;align-items:center}.editrow input{min-width:0;flex:1}.editrow input[type=number]{max-width:75px}#editor{position:relative;z-index:3}#editor[hidden]{display:none}body.editing .dock{display:none}.tile.dead:before{content:'× '}.tile.pending:before{content:'◇ '}
html{overflow-anchor:none;scroll-behavior:auto}.collapseHead{width:100%;text-align:left;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}.collapsed .head{margin-bottom:0}.tile.dead{opacity:1}.tile.pending{outline:2px solid var(--fg);outline-offset:-3px}</style><main><header><small>DESTRUCTION SHIRITORI / VER. 1.2.0</small><h1>デストラクションしりとり</h1><small>通話・対面プレイ用 / 手動判定</small><div class="tools"><button id="edit">ルール編集</button><label>配色 <select id="palette"></select></label></div></header><section id="editor" hidden><h2>ルール編集</h2><div id="fields"></div><div class="tools"><button id="addgroup">カテゴリ追加</button><button id="defaultRules">初期ルール</button><button id="exportRules">ルールコピー</button><button id="importRules">ルール読込</button><button id="applyRules">保存</button><button id="cancelRules">キャンセル</button></div></section><div class="stats" id="stats"></div><details><summary>操作方法・ルール</summary><p>単語を入力し、破壊するジャンルを選択。必要なら大カテゴリ全破壊を選択し、確定すると色が変わりログに記録されます。連鎖破壊は手動です。判定・勝敗は参加者で協議してください。</p><p>同じ単語は禁止。「ん」で終了。長音符は直前の文字、濁点・半濁点は同一扱い、小文字は大文字扱い。開始の「しりとり」は記録不要。</p></details><div id="board"></div><section><div class="head"><h2>しりとりログ</h2><button id="copy">ログをコピー</button></div><div id="log"></div></section><div class="tools"><button id="undo">↶ 一手戻す</button><button id="reset">ゲームリセット</button></div><p><small id="save">端末内に自動保存（通信・端末間同期なし）</small></p></main><div class="dock"><div class="dockinner"><div id="status" aria-live="polite"></div><div class="controls"><input id="word" placeholder="使用した単語" autocomplete="off"><button id="clear">選択解除</button><button class="primary" id="commit">確定</button></div></div></div><script>
const defaults=[['動物',3,['哺乳類','鳥類','爬虫類','両生類','虫','魚類','海の生き物']],['植物',3,['野菜','果物','花','木','穀物','菌＆その他']],['飲食物',2,['料理','菓子','飲料','酒類','調味料']],['乗り物',2,['自動車','鉄道','船舶','航空機','その他の乗り物']],['生活用品',3,['家具','家電','道具','文房具','時計','照明']],['身につける',2,['衣類','履物','装飾品＆化粧品','かばん類']],['娯楽',3,['漫画・アニメ','文学作品','映画・演劇','音楽・楽器','玩具・ゲーム','スポーツ','ギャンブル']],['自然・物質',3,['天体・宇宙','気象・自然現象','金属','その他の素材','エネルギー','色']],['人類',3,['人名','職業','身体部位','病気・症状','排泄物','感情','生死','人間関係']],['社会',3,['国','その他の地名','軍事・兵器','金銭・貴重品','建築物','組織・団体','法律・制度','行事・風習']],['知識・概念',2,['情報＆文字','学問＆思想＆宗教','神話＆伝承','芸術＆表現','時間＆数字＆単位']]];
let groups=JSON.parse(JSON.stringify(defaults));try{const r=JSON.parse(localStorage.getItem('ds-rules'));if(valid(r))groups=r}catch(e){}
const $=id=>document.getElementById(id),key='destruction-shiritori-v1';let history=[],selected=new Set(),whole=new Set();try{const h=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(h))history=h}catch(e){}const ids=g=>groups[g][2].map((_,i)=>g+':'+i);const dead=()=>new Set(history.flatMap(h=>h.destroyed));function save(){try{localStorage.setItem(key,JSON.stringify(history))}catch(e){$('save').textContent='自動保存できません。この画面を閉じると記録が失われる可能性があります。'}}function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}let collapsed=new Set(),previousFull=new Set();try{collapsed=new Set(JSON.parse(localStorage.getItem('ds-collapsed')||'[]'));previousFull=new Set(JSON.parse(localStorage.getItem('ds-full')||'[]'))}catch(e){}function render(){const y=window.scrollY;const oldSections=[...$('board').children];const anchor=oldSections.find(e=>e.getBoundingClientRect().bottom>0);const anchorIndex=oldSections.indexOf(anchor),anchorTop=anchor?.getBoundingClientRect().top;const total=groups.reduce((n,g)=>n+g[2].length,0);const d=dead();$('stats').replaceChildren();for(const [label,n] of [['生存',total-d.size],['破壊済み',d.size],['手数',history.length]]){const x=el('div',label);x.append(el('b',n));$('stats').append(x)}const fullNow=new Set(groups.map((_,g)=>g).filter(g=>ids(g).every(x=>d.has(x))));for(const g of fullNow)if(!previousFull.has(g))collapsed.add(g);for(const g of collapsed)if(!fullNow.has(g))collapsed.delete(g);previousFull=fullNow;try{localStorage.setItem('ds-collapsed',JSON.stringify([...collapsed]));localStorage.setItem('ds-full',JSON.stringify([...fullNow]))}catch(e){}$('board').replaceChildren();groups.forEach(([name,limit,labels],g)=>{const all=ids(g),count=all.filter(x=>d.has(x)).length,planned=all.filter(x=>selected.has(x)).length,full=count===all.length;const s=el('section'),head=el('div',undefined,'head');head.append(el('strong',name+(name==='自然・物質'?'（暫定）':'')),el('span',full?'全滅':`${count}${planned?' + '+planned:''} / ${limit} で全破壊`,count+planned>=limit?'ready':''));if(full){const toggle=el('button',undefined,'collapseHead');toggle.type='button';toggle.append(...head.childNodes,el('span',collapsed.has(g)?'▸':'▾'));toggle.setAttribute('aria-expanded',String(!collapsed.has(g)));toggle.onclick=()=>{collapsed.has(g)?collapsed.delete(g):collapsed.add(g);render()};head.append(toggle)}s.append(head);if(full&&collapsed.has(g)){s.classList.add('collapsed');$('board').append(s);return}const grid=el('div',undefined,'tiles');labels.forEach((label,i)=>{const id=all[i],b=el('button',label,'tile '+(d.has(id)?'dead':selected.has(id)||whole.has(g)?'pending':''));b.disabled=d.has(id);b.setAttribute('aria-pressed',String(selected.has(id)||whole.has(g)));b.onclick=()=>{if(whole.has(g))whole.delete(g);if(selected.has(id))selected.delete(id);else selected.add(id);render()};grid.append(b)});s.append(grid);const b=el('button',whole.has(g)?'全破壊の選択を解除':full?'全破壊済み':count+planned>=limit?'連鎖破壊を選択':'大カテゴリ直接破壊を選択','group '+(whole.has(g)?'pending':''));b.disabled=full;b.onclick=()=>{whole.has(g)?whole.delete(g):whole.add(g);render()};s.append(b);$('board').append(s)});$('log').replaceChildren();if(!history.length)$('log').append(el('small','まだ記録はありません'));history.forEach((h,i)=>{const e=el('div',undefined,'entry');e.append(el('small',String(i+1).padStart(2,'0')+'　'),el('b',h.word));const tags=el('div');for(const t of h.tags)tags.append(el('span',t,'tag'));if(!h.tags.length)tags.append(el('small','破壊なし'));e.append(tags);$('log').append(e)});$('undo').disabled=!history.length;$('edit').disabled=!!history.length;const pending=new Set([...selected,...[...whole].flatMap(ids)].filter(x=>!d.has(x)));$('status').textContent=`破壊予定 ${pending.size} ジャンル${whole.size?' / 全破壊 '+whole.size+'カテゴリ':''}`;const next=$('board').children[anchorIndex];window.scrollTo(0,next&&anchorTop!==undefined?window.scrollY+next.getBoundingClientRect().top-anchorTop:y);}
$('commit').onclick=()=>{const word=$('word').value.trim();if(!word){$('word').focus();return}const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));if(history.some(h=>norm(h.word)===norm(word))&&!confirm('同じ単語が記録されています。協議のうえ確定しますか？'))return;const d=dead(),destroyed=new Set([...selected].filter(x=>!d.has(x))),tags=[...destroyed].map(x=>{const [g,i]=x.split(':').map(Number);return groups[g][2][i]});for(const g of whole){const all=ids(g),chain=all.filter(x=>d.has(x)||selected.has(x)).length>=groups[g][1];tags.push((chain?'連鎖破壊：':'直接破壊：')+groups[g][0]+' 全滅');all.filter(x=>!d.has(x)).forEach(x=>destroyed.add(x))}history.push({word,tags,destroyed:[...destroyed]});selected.clear();whole.clear();$('word').value='';save();render()};$('clear').onclick=()=>{selected.clear();whole.clear();render()};$('undo').onclick=()=>{if(history.length&&confirm('直前の一手を取り消しますか？')){history.pop();selected.clear();whole.clear();save();render()}};$('reset').onclick=()=>{if(confirm('すべての盤面とログを初期化しますか？')){history=[];selected.clear();whole.clear();$('word').value='';save();render()}};$('copy').onclick=async()=>{const t=history.map((h,i)=>`${i+1}. ${h.word} ${h.tags.map(t=>'('+t+')').join('')}`).join('\n');try{await navigator.clipboard.writeText(t);alert('ログをコピーしました')}catch(e){const a=el('textarea');a.value=t;document.body.append(a);a.select();try{if(!document.execCommand('copy'))throw Error();alert('ログをコピーしました')}catch(e){prompt('ログを手動でコピーしてください',t)}a.remove()}};
function valid(r){return Array.isArray(r)&&r.length>0&&r.length<=100&&r.every(g=>Array.isArray(g)&&g.length===3&&typeof g[0]==='string'&&g[0].trim()&&Array.isArray(g[2])&&g[2].length>0&&g[2].length<=100&&g[2].every(x=>typeof x==='string'&&x.trim())&&Number.isInteger(g[1])&&g[1]>=1&&g[1]<=g[2].length)}
const palettes={'クラシック':['#101619','#202c30','#edf4f2','#194437','#66531e','#49272d','#526361'],'サイバー':['#101426','#242943','#ffffff','#174c78','#76519b','#922950','#687599'],'ミリタリー':['#292d23','#383d30','#ffffff','#56673c','#806023','#73433b','#78816b'],'ライト':['#f3f4f6','#ffffff','#24272b','#bce6d0','#ffe09a','#e8a6ab','#89939a'],'モノクロ':['#181818','#303030','#ffffff','#555555','#686868','#292929','#999999'],'ポップ':['#fff3e9','#ffffff','#352d40','#b9dcff','#ffdc80','#f3a5c3','#a391a0']};
Object.assign(palettes,{"デストラクション": ["#161616", "#292929", "#ffffff", "#454545", "#795600", "#a91e2c", "#777777"], "サクラ": ["#fff0f5", "#ffffff", "#513044", "#f5b5cf", "#ffe09a", "#e3a0b8", "#a77b91"], "オーシャン": ["#e3f4fa", "#ffffff", "#203e53", "#78c7e4", "#f5d579", "#a8b8d4", "#718ba0"], "フォレスト": ["#e6eddf", "#f5f7ed", "#344732", "#94b68a", "#dfc578", "#d5b1a1", "#78866e"], "溶岩": ["#211715", "#39231d", "#ffffff", "#94451e", "#795600", "#501b24", "#aa775d"], "アイス": ["#edf7ff", "#ffffff", "#30465b", "#b4d9f0", "#d8c6fa", "#b1c0cd", "#8297a9"], "ネオン": ["#151021", "#251b35", "#ffffff", "#126d60", "#756000", "#a32267", "#8c75a7"], "レトロゲーム": ["#c5cba1", "#e1e5c3", "#303c24", "#a1af78", "#e3d36a", "#a3a58e", "#66734c"], "和風": ["#f1e9d8", "#fffaf0", "#443c32", "#a4bca0", "#e3bd62", "#e2aaa0", "#95836c"], "ハロウィン": ["#231b30", "#382947", "#ffffff", "#9a5018", "#796000", "#7350a1", "#a88ab9"]});
for(const n of Object.keys(palettes))$('palette').append(el('option',n));function theme(n){if(!palettes[n])n='クラシック';$('palette').value=n;['bg','panel','fg','alive','pending','dead','edge'].forEach((k,i)=>document.documentElement.style.setProperty('--'+k,palettes[n][i]));try{localStorage.setItem('ds-theme',n)}catch(e){}}let themeName;try{themeName=localStorage.getItem('ds-theme')}catch(e){}theme(themeName);$('palette').onchange=()=>theme($('palette').value);
let draft=[];function closeEditor(){$('editor').hidden=true;document.body.classList.remove('editing');$('board').hidden=false;$('edit').disabled=!!history.length}function fields(){$('fields').replaceChildren();draft.forEach((g,i)=>{const sec=el('section'),row=el('div',undefined,'editrow'),name=el('input');name.value=g[0];name.oninput=()=>g[0]=name.value;const del=el('button','カテゴリ削除');del.disabled=draft.length===1;del.onclick=()=>{draft.splice(i,1);fields()};row.append(name,del);sec.append(row);const r=el('div',undefined,'editrow'),num=el('input');num.type='number';num.min=1;num.max=g[2].length;num.value=g[1];num.oninput=()=>g[1]=Number(num.value);r.append(el('span','全破壊条件'),num,el('span','/ '+g[2].length));sec.append(r);g[2].forEach((v,j)=>{const rr=el('div',undefined,'editrow'),inp=el('input'),b=el('button','削除');inp.value=v;inp.oninput=()=>g[2][j]=inp.value;b.disabled=g[2].length===1;b.onclick=()=>{g[2].splice(j,1);g[1]=Math.min(g[1],g[2].length);fields()};rr.append(inp,b);sec.append(rr)});const add=el('button','＋ ジャンル追加');add.onclick=()=>{g[2].push('新規ジャンル');fields()};sec.append(add);$('fields').append(sec)})}
$('edit').onclick=()=>{if(history.length)return;draft=JSON.parse(JSON.stringify(groups));$('editor').hidden=false;$('board').hidden=true;document.body.classList.add('editing');fields();window.scrollTo(0,0)};$('addgroup').onclick=()=>{draft.push(['新規カテゴリ',1,['新規ジャンル']]);fields()};$('defaultRules').onclick=()=>{if(confirm('初期ルールに戻しますか？（保存で反映）')){draft=JSON.parse(JSON.stringify(defaults));fields()}};$('cancelRules').onclick=closeEditor;$('applyRules').onclick=()=>{if(history.length){alert('ゲームをリセットしてください');return}if(!valid(draft)){alert('空欄や全破壊条件を確認してください');return}try{localStorage.setItem('ds-rules',JSON.stringify(draft))}catch(e){alert('保存できませんでした');return}groups=JSON.parse(JSON.stringify(draft));selected.clear();whole.clear();closeEditor();render()};$('exportRules').onclick=async()=>{if(!valid(draft)){alert('設定を確認してください');return}const t=JSON.stringify(draft);try{await navigator.clipboard.writeText(t);alert('ルールをコピーしました')}catch(e){prompt('ルールをコピーしてください',t)}};$('importRules').onclick=()=>{const t=prompt('共有されたルールを貼り付けてください');if(t===null)return;try{const r=JSON.parse(t);if(!valid(r))throw Error();draft=r;fields()}catch(e){alert('ルール形式が正しくありません')}};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
render();</script></html>
